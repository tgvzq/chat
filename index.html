<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<title>Messenger L</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --me:#2b6df6; --other:#242833; --text:#e8eaf0; --muted:#8a90a0; --green:#2ea36b; --red:#e5484d; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  .screen { display:none; height:100dvh; flex-direction:column; }
  .screen.active { display:flex; }

  /* Login */
  #login { align-items:center; justify-content:center; padding:24px; gap:14px; }
  #login h1 { font-size:28px; margin-bottom:8px; }
  #login p { color:var(--muted); font-size:14px; margin-bottom:10px; }
  #login form { width:100%; max-width:340px; display:flex; flex-direction:column; gap:12px; }
  input[type=text], input[type=password], #text, #name, #pass { width:100%; padding:14px 16px; border-radius:12px; border:1px solid #2c303c; background:var(--panel); color:var(--text); font-size:16px; outline:none; }
  input:focus { border-color:var(--me); }
  button { padding:14px; border:0; border-radius:12px; background:var(--me); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #err { color:#ff6b6b; font-size:14px; min-height:18px; text-align:center; }

  /* Header */
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); background:var(--panel); border-bottom:1px solid #22252f; }
  header .title { font-weight:700; }
  header .who { font-size:12px; color:var(--muted); }
  header .btns { display:flex; gap:6px; }
  header button { padding:8px 11px; font-size:15px; background:#2a2e3a; border-radius:10px; }
  header button.call { background:var(--green); }

  /* Incoming call banner */
  #banner { display:none; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; background:#1d3a2c; border-bottom:1px solid #285a42; font-size:14px; }
  #banner.show { display:flex; }
  #banner .acts { display:flex; gap:6px; }
  #banner button { padding:8px 12px; font-size:14px; background:var(--green); }

  /* Messages */
  #msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:16px; background:var(--other); align-self:flex-start; word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap; line-height:1.35; }
  .msg.me { align-self:flex-end; background:var(--me); }
  .msg .name { font-size:12px; font-weight:700; color:#7fb0ff; margin-bottom:2px; }
  .msg .time { font-size:10px; opacity:.6; text-align:right; margin-top:2px; }
  .msg img, .msg video { display:block; max-width:100%; max-height:320px; border-radius:10px; margin:2px 0; background:#000; }
  .msg.media { padding:6px; }
  .day { align-self:center; font-size:12px; color:var(--muted); margin:8px 0; }
  #busy { display:none; padding:6px 14px; font-size:13px; color:var(--muted); background:var(--panel); }
  #busy.show { display:block; }
  form#send { display:flex; gap:8px; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid #22252f; }
  form#send #text { flex:1; border-radius:22px; }
  form#send button { border-radius:22px; padding:0 18px; }
  form#send #attach { background:#2a2e3a; padding:0 14px; font-size:20px; }

  form#send #mic { background:#2a2e3a; padding:0 16px; font-size:20px; }
  #rec { display:none; align-items:center; gap:10px; padding:10px 12px; padding-bottom:max(10px, env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid #22252f; }
  #rec.show { display:flex; }
  #recDot { width:12px; height:12px; border-radius:50%; background:var(--red); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #recTime { flex:1; font-variant-numeric:tabular-nums; font-size:18px; }
  #rec button { border-radius:22px; padding:0 18px; height:46px; }
  #rec #recCancel { background:#2a2e3a; }
  .msg audio { display:block; width:240px; max-width:100%; margin:2px 0; }

  /* Lightbox */
  #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50; align-items:center; justify-content:center; }
  #lb.show { display:flex; }
  #lb img { max-width:100%; max-height:100%; }

  /* Call overlay */
  #call { display:none; position:fixed; inset:0; background:#000; z-index:40; flex-direction:column; }
  #call.active { display:flex; }
  #grid { flex:1; display:flex; flex-direction:column; gap:4px; padding:4px; padding-top:max(4px, env(safe-area-inset-top)); min-height:0; }
  .tile { position:relative; flex:1; background:#181b22; border-radius:14px; overflow:hidden; min-height:0; display:flex; align-items:center; justify-content:center; }
  .tile video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#181b22; }
  .tile .lbl { position:absolute; left:10px; bottom:8px; font-size:14px; font-weight:600; text-shadow:0 1px 3px #000; z-index:2; }
  .tile .st { position:relative; z-index:2; font-size:14px; color:#cfd3de; text-align:center; padding:0 12px; text-shadow:0 1px 3px #000; }
  #pip { position:absolute; right:12px; top:max(12px, env(safe-area-inset-top)); width:92px; height:128px; object-fit:cover; border-radius:12px; border:2px solid #2c303c; background:#111; z-index:5; transform:scaleX(-1); display:none; }
  #controls { display:flex; justify-content:center; gap:18px; padding:14px; padding-bottom:max(14px, env(safe-area-inset-bottom)); background:#0b0c10; }
  #controls button { width:58px; height:58px; border-radius:50%; padding:0; font-size:24px; background:#2a2e3a; }
  #controls button.off { background:#fff; color:#000; }
  #controls button.end { background:var(--red); }
</style>
</head>
<body>

<section id="login" class="screen active">
  <h1>🔒 Messenger L</h1>
  <p>Приватный чат для своих</p>
  <form id="loginForm" autocomplete="on">
    <input id="name" placeholder="Имя" autocapitalize="none" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button id="loginBtn" type="submit">Войти</button>
    <div id="err"></div>
  </form>
</section>

<section id="chat" class="screen">
  <header>
    <div><div class="title">Messenger L</div><div class="who" id="who"></div></div>
    <div class="btns">
      <button class="call" id="callAudio" title="Аудиозвонок">📞</button>
      <button class="call" id="callVideo" title="Видеозвонок">🎥</button>
      <button id="logout">Выйти</button>
    </div>
  </header>
  <div id="banner"><span id="bannerText"></span><span class="acts"><button id="joinAudio">📞</button><button id="joinVideo">🎥</button></span></div>
  <div id="msgs"></div>
  <div id="busy"></div>
  <form id="send" autocomplete="off">
    <button type="button" id="attach" title="Фото или видео">📎</button>
    <input id="text" placeholder="Сообщение" maxlength="2000">
    <button type="submit" id="sendBtn" style="display:none">➤</button>
    <button type="button" id="mic" title="Голосовое сообщение">🎤</button>
  </form>
  <div id="rec"><span id="recDot"></span><span id="recTime">0:00</span><button type="button" id="recCancel" title="Отменить">🗑</button><button type="button" id="recSend" title="Отправить">➤</button></div>
  <input id="file" type="file" accept="image/*,video/*" hidden>
</section>

<div id="lb"><img id="lbImg" alt=""></div>

<section id="call">
  <div id="grid"></div>
  <video id="pip" autoplay playsinline muted></video>
  <div id="controls">
    <button id="mute" title="Микрофон">🎤</button>
    <button id="cam" title="Камера">📷</button>
    <button id="hang" class="end" title="Завершить">📵</button>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, deleteDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCoU2dICPk5nVcP0jA1Z-Y4evWQJvdIw3g",
  authDomain: "messenger-l.firebaseapp.com",
  projectId: "messenger-l",
  storageBucket: "messenger-l.firebasestorage.app",
  messagingSenderId: "199511334954",
  appId: "1:199511334954:web:bc2960377f19e8da9fe353"
};

// Имя пользователя -> почта вида имя@chat.app
const DOMAIN = "@chat.app";

// Видео и большие файлы: бесплатный Cloudinary (заполни, чтобы включить видео)
const CLOUD = { cloudName: "xv9f1k1y", uploadPreset: "omar09" };

// Звонки: STUN бесплатный. Если звонки не соединяются в мобильной сети, добавь сюда TURN-сервер
const TURN = [
  // { urls: "turn:host:443", username: "...", credential: "..." }
];
const ICE = { iceServers: [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "stun:stun1.l.google.com:19302" },
  ...TURN
]};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll("section.screen").forEach(s => s.classList.remove("active")); $(id).classList.add("active"); };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

let me = null;
let unsubMsgs = null, unsubParts = null, partsTimer = null;

/* ---------- Вход ---------- */
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const name = $("name").value.trim().toLowerCase();
    await signInWithEmailAndPassword(auth, name + DOMAIN, $("pass").value);
  } catch (err) {
    $("err").textContent = "Неверное имя или пароль";
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("logout").addEventListener("click", async () => { await hangup(); signOut(auth); });

onAuthStateChanged(auth, user => {
  if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
  if (unsubParts) { unsubParts(); unsubParts = null; }
  if (partsTimer) { clearInterval(partsTimer); partsTimer = null; }
  if (!user) { me = null; show("login"); return; }
  me = { uid: user.uid, name: user.email.split("@")[0] };
  $("who").textContent = "Вы: " + me.name;
  show("chat");
  startChat();
  watchCalls();
});

/* ---------- Сообщения ---------- */
function safeMedia(url, type) {
  if (typeof url !== "string") return false;
  if (type === "image") return url.startsWith("data:image/") || url.startsWith("https://");
  if (type === "video") return url.startsWith("https://");
  if (type === "audio") return url.startsWith("data:audio/") || url.startsWith("https://");
  return false;
}

function startChat() {
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubMsgs = onSnapshot(q, snap => {
    const box = $("msgs");
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
    box.innerHTML = "";
    let lastDay = "";
    snap.docs.slice().reverse().forEach(d => {
      const m = d.data();
      const date = m.createdAt ? m.createdAt.toDate() : new Date();
      const day = date.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
      if (day !== lastDay) {
        const dv = document.createElement("div");
        dv.className = "day"; dv.textContent = day; box.appendChild(dv);
        lastDay = day;
      }
      const mine = m.uid === me.uid;
      const hasMedia = safeMedia(m.mediaUrl, m.mediaType);
      const el = document.createElement("div");
      el.className = "msg" + (mine ? " me" : "") + (hasMedia ? " media" : "");
      if (!mine) {
        const n = document.createElement("div");
        n.className = "name"; n.textContent = m.name || "?"; el.appendChild(n);
      }
      if (hasMedia) {
        if (m.mediaType === "image") {
          const im = document.createElement("img");
          im.src = m.mediaUrl; im.loading = "lazy";
          im.onclick = () => { $("lbImg").src = m.mediaUrl; $("lb").classList.add("show"); };
          el.appendChild(im);
        } else if (m.mediaType === "audio") {
          const a = document.createElement("audio");
          a.src = m.mediaUrl; a.controls = true; a.preload = "metadata";
          el.appendChild(a);
        } else {
          const v = document.createElement("video");
          v.src = m.mediaUrl; v.controls = true; v.playsInline = true; v.preload = "metadata";
          el.appendChild(v);
        }
      }
      if (m.text) {
        const t = document.createElement("div");
        t.textContent = m.text; el.appendChild(t);
      }
      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = date.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      el.appendChild(tm);
      box.appendChild(el);
    });
    if (nearBottom || snap.metadata.hasPendingWrites) box.scrollTop = box.scrollHeight;
  }, err => console.error(err));
  setTimeout(() => { const b = $("msgs"); b.scrollTop = b.scrollHeight; }, 500);
}

$("lb").addEventListener("click", () => $("lb").classList.remove("show"));

$("send").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || !me) return;
  $("text").value = ""; toggleSendMic();
  try {
    await addDoc(collection(db, "messages"), { text, name: me.name, uid: me.uid, createdAt: serverTimestamp() });
  } catch (err) {
    alert("Не отправилось: " + err.message);
    $("text").value = text; toggleSendMic();
  }
};

/* ---------- Фото и видео ---------- */
function setBusy(msg) { const b = $("busy"); b.textContent = msg || ""; b.classList.toggle("show", !!msg); }

function compressImage(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      let qq = q, out = c.toDataURL("image/jpeg", qq);
      while (out.length > 800000 && qq > 0.3) { qq -= 0.1; out = c.toDataURL("image/jpeg", qq); }
      URL.revokeObjectURL(u);
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Не удалось прочитать фото")); };
    img.src = u;
  });
}

$("attach").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f || !me) return;
  const isVid = f.type.startsWith("video/"), isImg = f.type.startsWith("image/");
  if (!isVid && !isImg) { alert("Можно отправлять только фото и видео"); return; }
  const cloud = CLOUD.cloudName && CLOUD.uploadPreset;
  if (isVid && !cloud) { alert("Для видео нужно подключить Cloudinary (бесплатно). Фото работают без него."); return; }
  setBusy(isVid ? "Загрузка видео…" : "Отправка фото…");
  try {
    let url;
    if (cloud) {
      const fd = new FormData();
      fd.append("file", f);
      fd.append("upload_preset", CLOUD.uploadPreset);
      const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD.cloudName}/auto/upload`, { method: "POST", body: fd });
      const j = await r.json();
      if (!j.secure_url) throw new Error((j.error && j.error.message) || "ошибка загрузки");
      url = j.secure_url;
    } else {
      url = await compressImage(f);
    }
    await addDoc(collection(db, "messages"), {
      text: "", mediaType: isVid ? "video" : "image", mediaUrl: url,
      name: me.name, uid: me.uid, createdAt: serverTimestamp()
    });
  } catch (err) {
    alert("Не отправилось: " + err.message);
  } finally {
    setBusy("");
  }
};

/* ---------- Голосовые сообщения ---------- */
let recorder = null, recChunks = [], recStream = null, recTimer = null, recStart = 0, recCancelled = false;

function blobToDataURL(b) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("Не удалось прочитать запись"));
    r.readAsDataURL(b);
  });
}
function pickMime() {
  const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  return c.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
}
function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function toggleSendMic() {
  const has = $("text").value.trim().length > 0;
  $("sendBtn").style.display = has ? "" : "none";
  $("mic").style.display = has ? "none" : "";
}
$("text").addEventListener("input", toggleSendMic);

function cleanupRec() {
  clearInterval(recTimer); recTimer = null;
  if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  $("rec").classList.remove("show");
  $("send").style.display = "";
  toggleSendMic();
}

async function startRec() {
  if (recorder) return;
  if (typeof inCall !== "undefined" && inCall) { alert("Во время звонка запись недоступна"); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Браузер не поддерживает запись голоса"); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { alert("Нет доступа к микрофону: " + err.message); return; }
  const mime = pickMime();
  recChunks = []; recCancelled = false;
  try { recorder = new MediaRecorder(recStream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 }); }
  catch (err) { cleanupRec(); alert("Не удалось начать запись"); return; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = onRecStop;
  recorder.start();
  recStart = Date.now();
  $("send").style.display = "none";
  $("rec").classList.add("show");
  $("recTime").textContent = "0:00";
  recTimer = setInterval(() => {
    const s = Math.floor((Date.now() - recStart) / 1000);
    $("recTime").textContent = fmtTime(s);
    if (s >= 300) stopRec(false);
  }, 250);
}

function stopRec(cancel) {
  if (!recorder) return;
  recCancelled = !!cancel;
  try { recorder.stop(); } catch (_) { onRecStop(); }
}

async function onRecStop() {
  const r = recorder;
  if (!r) return;
  recorder = null;
  const dur = Math.round((Date.now() - recStart) / 1000);
  const type = r.mimeType || "audio/webm";
  cleanupRec();
  if (recCancelled || dur < 1 || !recChunks.length || !me) { recChunks = []; return; }
  const blob = new Blob(recChunks, { type });
  recChunks = [];
  setBusy("Отправка голосового…");
  try {
    let url;
    if (CLOUD.cloudName && CLOUD.uploadPreset) {
      const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
      const fd = new FormData();
      fd.append("file", blob, "voice." + ext);
      fd.append("upload_preset", CLOUD.uploadPreset);
      const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD.cloudName}/auto/upload`, { method: "POST", body: fd });
      const j = await resp.json();
      if (!j.secure_url) throw new Error((j.error && j.error.message) || "ошибка загрузки");
      url = j.secure_url;
    } else {
      if (blob.size > 600000) throw new Error("Запись слишком длинная (нужен Cloudinary)");
      url = await blobToDataURL(blob);
    }
    await addDoc(collection(db, "messages"), {
      text: "", mediaType: "audio", mediaUrl: url, duration: dur,
      name: me.name, uid: me.uid, createdAt: serverTimestamp()
    });
  } catch (err) {
    alert("Не отправилось: " + err.message);
  } finally {
    setBusy("");
  }
}

$("mic").onclick = startRec;
$("recCancel").onclick = () => stopRec(true);
$("recSend").onclick = () => stopRec(false);

/* ---------- Звонки (WebRTC, до 3 человек) ---------- */
let inCall = false, localStream = null, myJoinedAt = 0, myVideo = false;
let hbTimer = null, sigUnsub = null, sigChain = Promise.resolve();
let lastParts = [];
const peers = {};
const pendingC = {};

const activeParts = () => {
  const now = Date.now();
  return lastParts.filter(p => p.id !== me.uid && now - (p.beat || 0) < 30000);
};

function watchCalls() {
  unsubParts = onSnapshot(collection(db, "callRoom"), snap => {
    lastParts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    onParts();
  }, err => console.error(err));
  partsTimer = setInterval(onParts, 8000);
}

function onParts() {
  if (!me) return;
  const act = activeParts();
  const banner = $("banner");
  if (!inCall) {
    if (act.length) {
      $("bannerText").textContent = "📞 В звонке: " + act.map(p => p.name).join(", ");
      banner.classList.add("show");
    } else banner.classList.remove("show");
    return;
  }
  banner.classList.remove("show");
  for (const p of act) {
    const e = peers[p.id];
    if (e && e.joinedAt !== p.joinedAt) closePeer(p.id);
    if (!peers[p.id]) {
      const iOffer = p.joinedAt < myJoinedAt || (p.joinedAt === myJoinedAt && p.id < me.uid);
      if (iOffer) startOffer(p);
      else ensureTile(p.id, p.name, "Ожидание…");
    }
  }
  for (const id of Object.keys(peers)) if (!act.find(p => p.id === id)) closePeer(id);
  for (const id of Object.keys(tiles)) if (!act.find(p => p.id === id)) removeTile(id);
}

const tiles = {};
function ensureTile(id, name, status) {
  if (tiles[id]) return tiles[id];
  const el = document.createElement("div");
  el.className = "tile";
  const vid = document.createElement("video");
  vid.autoplay = true; vid.playsInline = true;
  const st = document.createElement("div");
  st.className = "st"; st.textContent = status || "Соединение…";
  const lbl = document.createElement("div");
  lbl.className = "lbl"; lbl.textContent = name || "?";
  el.append(vid, st, lbl);
  $("grid").appendChild(el);
  tiles[id] = { el, vid, st };
  return tiles[id];
}
function removeTile(id) {
  if (tiles[id]) { tiles[id].el.remove(); delete tiles[id]; }
}

function sendSignal(to, type, data) {
  return addDoc(collection(db, "callSignals"), {
    from: me.uid, to, type, data, name: me.name, joined: myJoinedAt, at: Date.now()
  }).catch(err => console.error(err));
}

function makePeer(id, name, joined) {
  const pc = new RTCPeerConnection(ICE);
  const tile = ensureTile(id, name, "Соединение…");
  const e = { pc, joinedAt: joined, q: pendingC[id] || [], tile };
  delete pendingC[id];
  peers[id] = e;
  pc.onicecandidate = ev => { if (ev.candidate) sendSignal(id, "candidate", JSON.stringify(ev.candidate)); };
  pc.ontrack = ev => { if (ev.streams && ev.streams[0]) { tile.vid.srcObject = ev.streams[0]; } };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === "connected") tile.st.textContent = "";
    else if (s === "failed") tile.st.textContent = "Не удалось соединиться (возможно, нужен TURN-сервер)";
    else if (s === "disconnected") tile.st.textContent = "Связь потеряна…";
    else tile.st.textContent = "Соединение…";
  };
  return e;
}

function attachLocal(pc) {
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
}

async function flush(e) {
  const q = e.q; e.q = [];
  for (const c of q) { try { await e.pc.addIceCandidate(c); } catch (err) { console.warn(err); } }
}

async function startOffer(p) {
  const e = makePeer(p.id, p.name, p.joinedAt);
  try {
    attachLocal(e.pc);
    if (!localStream.getVideoTracks().length) e.pc.addTransceiver("video", { direction: "recvonly" });
    const off = await e.pc.createOffer();
    await e.pc.setLocalDescription(off);
    await sendSignal(p.id, "offer", JSON.stringify(e.pc.localDescription));
  } catch (err) { console.error(err); }
}

async function handleSignal(s) {
  if (!inCall) return;
  const from = s.from;
  try {
    if (s.type === "offer") {
      closePeer(from);
      const e = makePeer(from, s.name, s.joined);
      await e.pc.setRemoteDescription(JSON.parse(s.data));
      attachLocal(e.pc);
      await flush(e);
      const ans = await e.pc.createAnswer();
      await e.pc.setLocalDescription(ans);
      await sendSignal(from, "answer", JSON.stringify(e.pc.localDescription));
    } else if (s.type === "answer") {
      const e = peers[from];
      if (!e) return;
      await e.pc.setRemoteDescription(JSON.parse(s.data));
      await flush(e);
    } else if (s.type === "candidate") {
      const c = JSON.parse(s.data);
      const e = peers[from];
      if (!e) { (pendingC[from] = pendingC[from] || []).push(c); return; }
      if (e.pc.remoteDescription) await e.pc.addIceCandidate(c);
      else e.q.push(c);
    }
  } catch (err) { console.error(err); }
}

function closePeer(id) {
  const e = peers[id];
  if (!e) return;
  try { e.pc.close(); } catch (_) {}
  delete peers[id];
  removeTile(id);
}

async function beat() {
  try { await setDoc(doc(db, "callRoom", me.uid), { name: me.name, joinedAt: myJoinedAt, beat: Date.now(), video: myVideo }); } catch (err) { console.error(err); }
}

async function joinCall(video) {
  if (inCall || !me) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert("Браузер не поддерживает звонки"); return; }
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: "user" } : false });
  } catch (err) {
    alert("Нет доступа к микрофону/камере: " + err.message);
    return;
  }
  inCall = true; myVideo = !!video; myJoinedAt = Date.now();
  for (const k of Object.keys(pendingC)) delete pendingC[k];
  $("call").classList.add("active");
  $("banner").classList.remove("show");
  const pip = $("pip");
  pip.srcObject = localStream;
  pip.style.display = video ? "block" : "none";
  $("cam").style.display = video ? "" : "none";
  $("mute").classList.remove("off"); $("mute").textContent = "🎤";
  $("cam").classList.remove("off");

  try {
    const old = await getDocs(query(collection(db, "callSignals"), where("to", "==", me.uid)));
    await Promise.all(old.docs.map(d => deleteDoc(d.ref).catch(() => {})));
  } catch (_) {}

  sigUnsub = onSnapshot(query(collection(db, "callSignals"), where("to", "==", me.uid)), snap => {
    const added = snap.docChanges().filter(c => c.type === "added");
    added.sort((a, b) => (a.doc.data().at || 0) - (b.doc.data().at || 0));
    added.forEach(ch => {
      const s = ch.doc.data();
      deleteDoc(ch.doc.ref).catch(() => {});
      sigChain = sigChain.then(() => handleSignal(s));
    });
  }, err => console.error(err));

  await beat();
  hbTimer = setInterval(beat, 10000);
  onParts();
}

async function hangup() {
  if (!inCall) return;
  inCall = false;
  clearInterval(hbTimer); hbTimer = null;
  if (sigUnsub) { sigUnsub(); sigUnsub = null; }
  Object.keys(peers).forEach(closePeer);
  Object.keys(tiles).forEach(removeTile);
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $("pip").srcObject = null;
  $("call").classList.remove("active");
  try { await deleteDoc(doc(db, "callRoom", me.uid)); } catch (_) {}
  onParts();
}

window.addEventListener("pagehide", () => { if (inCall && me) deleteDoc(doc(db, "callRoom", me.uid)).catch(() => {}); });

$("callAudio").onclick = () => joinCall(false);
$("callVideo").onclick = () => joinCall(true);
$("joinAudio").onclick = () => joinCall(false);
$("joinVideo").onclick = () => joinCall(true);
$("hang").onclick = hangup;
$("mute").onclick = () => {
  if (!localStream) return;
  const t = localStream.getAudioTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $("mute").classList.toggle("off", !t.enabled);
  $("mute").textContent = t.enabled ? "🎤" : "🔇";
};
$("cam").onclick = () => {
  if (!localStream) return;
  const t = localStream.getVideoTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $("cam").classList.toggle("off", !t.enabled);
};
</script>
